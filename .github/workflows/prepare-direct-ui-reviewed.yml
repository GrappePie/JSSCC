name: Prepare reviewed direct UI blobs
on:
  push:
    branches: [feat/direct-sequence-play-20260908]
    paths: [.github/workflows/prepare-direct-ui-reviewed.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.2
      - name: Prepare the exact local source; never move refs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import yaml
          code=yaml.safe_load(Path('.github/workflows/prepare-direct-ui.yml').read_text())['jobs']['prepare']['steps'][1]['run']
          first,sep,last=code.partition('expected={')
          assert sep
          env={};exec(compile(first,'reviewed-preparation','exec'),env)
          p=Path('js/edition-ui.js');s=p.read_text()
          s=s.replace('\nif(serial!==remoteSerial)return;', '\n          if(serial!==remoteSerial)return;')
          s=s.replace("\ntell(stage==='convert'", "\n          tell(stage==='convert'")
          p.write_text(s)
          exec(compile(sep+last,'verified-blob-write','exec'),env)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-direct-ui-reviewed
          path: prepared
          retention-days: 7
