name: Real sequence one-click playback
on:
  push:
    branches: [feat/direct-sequence-play-20260908, github-pages]
    paths: ['js/sequence*', 'js/edition-ui.js', 'tests/sequence_browser.py', '.github/workflows/sequence-live-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Test the public bridge and unmodified actual source data through the real player
        env:
          LIVE_SEQUENCE_SMOKE: '1'
        run: |
          mkdir -p sequence-live-results
          git rev-parse HEAD > sequence-live-results/commit.txt
          python tests/sequence_browser.py sequence-live-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequence-live-ui
          path: sequence-live-results
          retention-days: 7
