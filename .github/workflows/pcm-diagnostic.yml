name: PCM startup diagnostic
on:
  push:
    branches: [fix/pcm-matrix-20260908]
    paths: [.github/workflows/pcm-diagnostic.yml, tests/pcm_offline_worklet.py]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/pcm_offline_worklet.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcm-startup-diagnostic
          path: startup-evidence/
          retention-days: 7
