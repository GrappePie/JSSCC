name: Audio regression checks
on:
  push:
    branches: [github-pages, fix/audit-20260908, fix/reference-envelope-psg-20260908, fix/pcm-matrix-20260908, fix/live-ui-20260908, feat/pcm-edition-sequencer-20260908, fix/panel-startup-20260908, feat/direct-sequence-play-20260908]
    paths: ['js/**', 'index.html', 'tests/*regressions*', 'tests/pcm_browser.py', 'tests/pcm-polyphony*', 'tests/pcm-reference-fixtures.json', 'tests/run_silent_audio_ci.py', 'tests/ui*', 'tests/edition*', 'tests/startup*', 'tests/sequence*', 'src/**', 'credits.html', 'assets/**', 'css/**', '.github/workflows/audio-regression.yml']
  pull_request:
    branches: [github-pages]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve exact implementation and tests
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          git archive --format=zip HEAD js assets css index.html credits.html README.md src tests tools docs .github/workflows/audio-regression.yml > test-results/tested-source.zip
      - name: Run required Node regression suite
        run: node --test tests/regressions.cjs | tee test-results/node-tests.txt
      - name: Test integer PCM kernel, 992 native prefixes and state-conditioned chords
        run: node --test tests/pcm-regressions.cjs tests/pcm-polyphony.cjs | tee test-results/pcm-node-tests.txt
      - name: Test read-only UI meters and unchanged PCM
        run: node --test tests/ui-meters.cjs | tee test-results/ui-node-tests.txt
      - name: Test edition metadata and safe reference library
        run: node --test tests/edition-regressions.cjs | tee test-results/edition-node-tests.txt
      - name: Test renderer bootstrap ordering
        run: node --test tests/startup-regressions.cjs | tee test-results/startup-node-tests.txt
      - name: Test bounded automatic sequence import
        run: node --test tests/sequence-regressions.cjs | tee test-results/sequence-node-tests.txt
      - name: Install pinned browser test dependencies
        # Playwright 1.55 stalls AudioWorklet targets (microsoft/playwright#37592).
        run: python -m pip install playwright==1.56.0 numpy==2.2.6
      - name: Install Chromium for end-to-end tests
        run: python -m playwright install --with-deps chromium
      - name: Generate original synthetic MIDI corpus
        run: node tools/generate_corpus.cjs test-results/corpus
      - name: Test comparison tool on synthetic WAVs
        run: python tools/compare_wavs.py --self-test --output test-results/comparison-self-test.json
      - name: Test the full HTTP site with real native silent-sink audio
        if: ${{ !cancelled() }}
        run: python tests/run_silent_audio_ci.py browser_regressions.py test-results | tee test-results/browser-tests.log
      - name: Test decoded envelopes and reference audio
        if: ${{ !cancelled() }}
        run: python tests/reference_audio_regressions.py test-results | tee test-results/reference-audio-tests.log
      - name: Test PCM AudioWorklet and full HTTP UI with real native silent-sink audio
        if: ${{ !cancelled() }}
        run: python tests/run_silent_audio_ci.py pcm_browser.py test-results | tee test-results/pcm-browser-tests.log
      - name: Test live POLY lamps, flow bar and smooth panel pixels
        if: ${{ !cancelled() }}
        run: python tests/run_silent_audio_ci.py ui_browser.py test-results | tee test-results/ui-browser-tests.log
      - name: Test edition drawer, local MIDI playback and attribution
        if: ${{ !cancelled() }}
        run: python tests/edition_browser.py test-results | tee test-results/edition-browser-tests.log
      - name: Test assets finishing before window load
        if: ${{ !cancelled() }}
        run: python tests/startup_browser.py test-results | tee test-results/startup-browser-tests.log
      - name: Test automatic sequence playback without a file dialog
        if: ${{ !cancelled() }}
        run: python tests/sequence_browser.py test-results | tee test-results/sequence-browser-tests.log
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-regression-evidence
          path: test-results
          retention-days: 7
