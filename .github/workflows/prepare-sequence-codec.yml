name: Prepare multi-kit sequence codec
on:
  push:
    branches: [feat/direct-sequence-play-20260908]
    paths: [.github/workflows/prepare-sequence-codec.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the bounded drum combination adjustment
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          f=Path('js/sequence-codec.js');s=f.read_text()
          s=s.replace('    let next=0,drums=0,eventCount=0,clipped=0,noteCount=0;', "    const mergeDrums=ids.filter(id=>drumIds.has(id%10000)).length>2;\n    if(ids.length>128)fail('más de 128 pistas de origen');\n    if(mergeDrums)warnings.add('Más de dos kits se combinaron en un canal de percusión; volumen aplicado por golpe y panorama centrado.');\n    let next=0,drums=0,eventCount=0,clipped=0,noteCount=0;")
          s=s.replace("      if(drum&&drums===2)fail('más de dos kits de percusión independientes');\n",'').replace('const channel=drum?9+16*drums++:melodic[next++]','const channel=drum?(mergeDrums?9:9+16*drums++):melodic[next++]')
          s=s.replace('      for(const t of samplingTimes([vol,globalVolume,pan],end)) {',"      if(drum&&mergeDrums){add(0,[176|c,11,127],0);add(0,[176|c,10,64],0);}\n      for(const t of (drum&&mergeDrums?[]:samplingTimes([vol,globalVolume,pan],end))) {")
          s=s.replace('Math.round(n.volume*50*peakScale)','Math.round(n.volume*50*(drum&&mergeDrums?globalVolume.at(n.time)*vol.at(n.time):peakScale))')
          assert hashlib.sha256(s.encode()).hexdigest()=='59fef84267b1248daaf8737e875297b78edc5960b17bc4101b352f5f201664d6','codec transcription mismatch'
          f.write_text(s)
      - name: Validate all six library cards plus a real reference sequence
        shell: bash
        run: |
          mkdir -p prepared-codec
          node <<'JS'
          const fs=require('node:fs'),C=require('./js/sequence-codec.js'),P=require('./js/midi-core.js');
          (async()=>{const results=[];for(const id of [1536400,5751539,5760498,5729533,4968652,5730663,5760767]){try{const r=await fetch('https://jsscc-sequence-bridge.lovable.app/api/public/sequence-bridge?id='+id,{headers:{Origin:'https://grappepie.github.io'},signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error('HTTP '+r.status);const bytes=new Uint8Array(await r.arrayBuffer()),out=C.convert(bytes,{id}),m=P.parseMidi(out.bytes.buffer,'live.mid');results.push({id,pass:true,bytes:bytes.length,report:out.report,parsedNotes:m.events.filter(e=>e.type==='on').length,cors:r.headers.get('access-control-allow-origin')});}catch(e){results.push({id,pass:false,error:e.message});}}fs.writeFileSync('prepared-codec/live.json',JSON.stringify({source:'unmocked public endpoints; note bytes are not saved',results},null,2));console.log(JSON.stringify(results,null,2));if(results.some(x=>!x.pass))process.exitCode=1;})().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Create the reviewed immutable codec blob, without updating refs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import json,os,hashlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='GrappePie/JSSCC'
          raw=Path('js/sequence-codec.js').read_bytes()
          digest=hashlib.sha256(raw).hexdigest();assert digest=='59fef84267b1248daaf8737e875297b78edc5960b17bc4101b352f5f201664d6'
          req=urllib.request.Request('https://api.github.com/repos/GrappePie/JSSCC/git/blobs',data=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:blob=json.load(r)
          Path('prepared-codec/blob.json').write_text(json.dumps({'path':'js/sequence-codec.js','sha':blob['sha'],'sha256':digest},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-direct-codec
          path: prepared-codec
          retention-days: 7
