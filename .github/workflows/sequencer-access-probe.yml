name: Online Sequencer access probe
on:
  push:
    branches: [feat/pcm-edition-sequencer-20260908]
    paths: [.github/workflows/sequencer-access-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect a bounded set of public resources, without credentials
        shell: python
        run: |
          import json, re, urllib.request, urllib.error, urllib.parse
          from pathlib import Path
          out=Path('probe');out.mkdir()
          origin='https://onlinesequencer.net'
          summary=[]
          def get(path, label):
              url=urllib.parse.urljoin(origin,path)
              if urllib.parse.urlsplit(url).hostname != 'onlinesequencer.net': return ''
              req=urllib.request.Request(url,headers={'Origin':'https://grappepie.github.io','User-Agent':'JSSCC-Compatibility-Check/0.1 (+https://github.com/GrappePie/JSSCC)'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      raw=r.read(1000001);headers=dict(r.headers);status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(50000);headers=dict(e.headers);status=e.code
              except Exception as e:
                  summary.append({'url':url,'error':str(e)});return ''
              row={'url':url,'status':status,'headers':{k:v for k,v in headers.items() if k.lower() in ['content-type','access-control-allow-origin','access-control-allow-credentials','x-frame-options','content-security-policy','location']},'bytes':len(raw)}
              summary.append(row)
              # Never save a large song file; headers suffice for the data endpoint.
              text=raw.decode('utf-8','replace')
              if status==200 and 'text' in headers.get('Content-Type',''):
                  (out/(label+'.txt')).write_text(text)
              return text if status==200 else ''
          get('/robots.txt','robots')
          listing=get('/sequences','listing')
          page=get('/1536400','sequence')
          get('/app/api/get_proto.php?id=1536400','data-headers')
          scripts=[]
          for text in [listing,page]:
              for src in re.findall(r'<script[^>]+src=[\"\x27]([^\"\x27]+)',text):
                  url=urllib.parse.urljoin(origin,src)
                  if urllib.parse.urlsplit(url).hostname=='onlinesequencer.net' and url not in scripts:scripts.append(url)
          (out/'scripts.json').write_text(json.dumps(scripts,indent=2))
          chosen=[u for u in scripts if any(t in u.lower() for t in ['sequence','midi','main','browse','list','export','proto'])][:6]
          for i,url in enumerate(chosen):get(url,'script-'+str(i))
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequencer-access-probe
          path: probe
          retention-days: 7
