name: Studio regressions

on:
  push:
    branches: [github-pages]
    paths:
      - 'studio.html'
      - 'css/studio.css'
      - 'js/studio.js'
      - 'js/studio-editing.js'
      - 'js/midi-writer.js'
      - 'js/community-adapter.js'
      - 'tests/studio-regressions.cjs'
      - 'tests/studio_browser.py'
      - '.github/workflows/studio-regression.yml'
  pull_request:
    paths:
      - 'studio.html'
      - 'css/studio.css'
      - 'js/studio.js'
      - 'js/studio-editing.js'
      - 'js/midi-writer.js'
      - 'js/community-adapter.js'
      - 'tests/studio-regressions.cjs'
      - 'tests/studio_browser.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Studio model and MIDI regressions
        run: node --test tests/studio-regressions.cjs
      - name: Install browser regression dependency
        run: python -m pip install playwright==1.56.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Studio browser tool workflow
        run: python tests/studio_browser.py test-results
      - name: Preserve Studio browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-regression-evidence
          path: test-results
